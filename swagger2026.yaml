openapi: 3.0.4
info:
  title: MatuleApp API
  description: API для мобильного приложения Matule на основе PocketBase
  version: 2.0.0
  contact:
    email: hello@world.ru

servers:
  - url: http://192.168.21.44:8090/api
    description: Локальный сервер PocketBase

tags:
  - name: auth
    description: Аутентификация и управление пользователями
  - name: products
    description: Товары и каталог
  - name: cart
    description: Корзина покупок
  - name: orders
    description: Заказы
  - name: projects
    description: Проекты пользователя
  - name: stocks
    description: Акции и предложения

paths:
  # ============== АУТЕНТИФИКАЦИЯ ==============
  /collections/users/auth-with-password:
    post:
      tags:
        - auth
      summary: Авторизация пользователя
      operationId: authUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /collections/users/records:
    post:
      tags:
        - auth
      summary: Регистрация нового пользователя
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка регистрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /collections/users/records/{id}:
    get:
      tags:
        - auth
      summary: Получение информации о пользователе
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
    
    patch:
      tags:
        - auth
      summary: Обновление профиля пользователя
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Профиль обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка обновления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  # ============== ТОВАРЫ ==============
  /collections/products/records:
    get:
      tags:
        - products
      summary: Получение списка товаров с фильтрацией
      operationId: getProducts
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: Фильтр PocketBase (например, "category='forMan'")
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Поиск по тексту в поле searchText
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Сортировка (например, "-created" или "price")
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Номер страницы
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Количество элементов на странице
      responses:
        '200':
          description: Список товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsList'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /collections/products/records/{id}:
    get:
      tags:
        - products
      summary: Получение детальной информации о товаре
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Детальная информация о товаре
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============== АКЦИИ ==============
  /collections/stocks/records:
    get:
      tags:
        - stocks
      summary: Получение списка акций
      operationId: getStocks
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Список акций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocksList'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============== КОРЗИНА ==============
  /collections/cart/records:
    get:
      tags:
        - cart
      summary: Получение корзины пользователя
      operationId: getCart
      responses:
        '200':
          description: Корзина пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
    
    post:
      tags:
        - cart
      summary: Создание или обновление корзины
      operationId: updateCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
      responses:
        '200':
          description: Корзина обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /collections/cart/records/{id}:
    delete:
      tags:
        - cart
      summary: Очистка корзины
      operationId: clearCart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Корзина очищена
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  # ============== ЗАКАЗЫ ==============
  /collections/orders/records:
    post:
      tags:
        - orders
      summary: Создание заказа из корзины
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

    get:
      tags:
        - orders
      summary: Получение списка заказов пользователя
      operationId: getUserOrders
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersList'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  # ============== ПРОЕКТЫ ==============
  /collections/projects/records:
    get:
      tags:
        - projects
      summary: Получение списка проектов пользователя
      operationId: getUserProjects
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsList'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
    
    post:
      tags:
        - projects
      summary: Создание нового проекта
      operationId: createProject
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /collections/projects/records/{id}:
    delete:
      tags:
        - projects
      summary: Удаление проекта
      operationId: deleteProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Проект удален
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ============== ОСНОВНЫЕ МОДЕЛИ ==============
    User:
      type: object
      properties:
        id:
          type: string
        collectionId:
          type: string
        collectionName:
          type: string
        username:
          type: string
        email:
          type: string
        emailVisibility:
          type: boolean
        verified:
          type: boolean
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        userFirstName:
          type: string
        userMiddleName:
          type: string
        userLastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]

    Product:
      type: object
      properties:
        id:
          type: string
        collectionId:
          type: string
        collectionName:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        type:
          type: string
          enum: [male, female, unisex]
        category:
          type: string
          enum: [forMan, forWoman, forAll]
        approximateCost:
          type: number
          format: float
        searchText:
          type: string
        image:
          type: string

    CartItem:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        title:
          type: string
        price:
          type: number
          format: float
        image:
          type: string

    Cart:
      type: object
      properties:
        id:
          type: string
        collectionId:
          type: string
        collectionName:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        user:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'

    Order:
      type: object
      properties:
        id:
          type: string
        collectionId:
          type: string
        collectionName:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        user:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        totalAmount:
          type: number
          format: float
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]

    Stock:
      type: object
      properties:
        id:
          type: string
        collectionId:
          type: string
        collectionName:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        title:
          type: string
        price:
          type: number
          format: float
        image:
          type: string

    Project:
      type: object
      properties:
        id:
          type: string
        collectionId:
          type: string
        collectionName:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        user:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [male, female, unisex]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        descriptionSource:
          type: string
        category:
          type: string
          enum: [forMan, forWoman, forAll]
        image:
          type: string

    # ============== ЗАПРОСЫ ==============
    AuthRequest:
      type: object
      required:
        - identity
        - password
      properties:
        identity:
          type: string
          example: "user@example.com"
        password:
          type: string
          example: "Password123"

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - passwordConfirm
        - userMiddleName
        - userLastName
        - birthDate
        - gender
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        passwordConfirm:
          type: string
        userFirstName:
          type: string
        userMiddleName:
          type: string
        userLastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]

    UpdateUserRequest:
      type: object
      properties:
        userFirstName:
          type: string
        userMiddleName:
          type: string
        userLastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]

    CartRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'

    OrderRequest:
      type: object
      properties:
        cartId:
          type: string
        shippingAddress:
          type: string
        paymentMethod:
          type: string
          enum: [card, cash]

    ProjectRequest:
      type: object
      required:
        - title
        - type
        - startDate
        - endDate
        - descriptionSource
        - category
        - image
      properties:
        title:
          type: string
        type:
          type: string
          enum: [male, female, unisex]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        descriptionSource:
          type: string
        category:
          type: string
          enum: [forMan, forWoman, forAll]
        image:
          type: string
          format: binary

    # ============== ОТВЕТЫ С ПАГИНАЦИЕЙ ==============
    ProductsList:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    StocksList:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Stock'

    ProjectsList:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    OrdersList:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    # ============== СПЕЦИАЛЬНЫЕ ОТВЕТЫ ==============
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        record:
          $ref: '#/components/schemas/User'

    CartResponse:
      type: object
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    # ============== ОШИБКИ ==============
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object